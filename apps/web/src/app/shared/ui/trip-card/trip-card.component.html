<a class="trip-card-link" [routerLink]="link()" [attr.aria-label]="'View details for ' + title()">
  <mat-card class="trip-card" appearance="outlined">
    <div class="image-frame">
      @if (!imageFailed()) {
        <img [src]="imageUrl()" [alt]="title()" loading="lazy" (error)="markImageFailed()" />
      } @else {
        <div class="image-fallback" aria-hidden="true">
          {{ title().slice(0, 1) }}
        </div>
      }
    </div>
    <mat-card-content>
      <mat-chip-set aria-label="Trip tag">
        <mat-chip>{{ tag() }}</mat-chip>
      </mat-chip-set>
      <h3>{{ title() }}</h3>
      <p>{{ subtitle() }}</p>
      <small>{{ meta() }}</small>
    </mat-card-content>
  </mat-card>
</a>
