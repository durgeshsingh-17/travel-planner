<section class="carousel-section" [attr.aria-labelledby]="eyebrow()">
  <div class="section-heading">
    <span [id]="eyebrow()">{{ eyebrow() }}</span>
    <h2>{{ title() }}</h2>
    <p>{{ description() }}</p>
  </div>

  <div class="card-grid" aria-label="Trip cards">
    @for (card of cards(); track card.link.join('/')) {
      <app-trip-card
        [title]="card.title"
        [subtitle]="card.subtitle"
        [imageUrl]="card.imageUrl"
        [meta]="card.meta"
        [tag]="card.tag"
        [link]="card.link"
      />
    }
  </div>
  <mat-divider />
</section>
