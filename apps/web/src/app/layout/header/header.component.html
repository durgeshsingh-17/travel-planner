<mat-toolbar class="site-header">
  <a class="brand" routerLink="/" aria-label="Travel Platform home">
    <span aria-hidden="true">TP</span>
    Travel Platform
  </a>
  <nav aria-label="Primary navigation">
    <a mat-button routerLink="/plan">Plan</a>
    <a mat-button routerLink="/explore">Explore</a>
    <a mat-button routerLink="/itinerary">Itinerary</a>
    <a mat-button routerLink="/saved-trips">Saved</a>
    <a mat-button routerLink="/vehicles">Vehicles</a>
  </nav>
  <div class="header-actions">
    <mat-slide-toggle
      [checked]="isDarkMode()"
      aria-label="Toggle dark mode"
      (change)="toggleTheme($event.checked)"
    >
      Dark
    </mat-slide-toggle>
    @if (session.session().user; as user) {
      @if (session.isEditor()) {
        <a mat-button routerLink="/admin">Admin</a>
      }
      <a mat-button routerLink="/profile" [attr.aria-label]="'Profile for ' + user.name">
        {{ user.name.split(' ')[0] }}
      </a>
    } @else {
      <a mat-button routerLink="/sign-in">Sign in</a>
    }
    <a mat-flat-button color="primary" routerLink="/plan">Plan Trip</a>
  </div>
</mat-toolbar>
