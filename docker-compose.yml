services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: travel-platform-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner}
    volumes:
      - travel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:7-alpine
  #   container_name: travel-platform-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   profiles:
  #     - cache

volumes:
  travel_postgres_data:
